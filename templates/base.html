<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AttritionIQ{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">Attrition<span>IQ</span></div>
  <div class="nav-links">
    <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}">Overview</a>
    <a href="/eda" class="{% if request.endpoint == 'eda' %}active{% endif %}">Analysis</a>
    <a href="/predict" class="{% if request.endpoint == 'predict_page' %}active{% endif %}">Predict Risk</a>
  </div>
  <div class="nav-badge">XGBoost · ROC-AUC 0.912</div>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>© {{ year }} AttritionIQ — Intelligent HR Analytics Platform</p>
</footer>

</body>
</html>
